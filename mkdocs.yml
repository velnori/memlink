site_name: memlink
site_description: AI Memory Interchange Layer — bridge AI memory formats
site_url: https://velnori.github.io/memlink/
repo_url: https://github.com/velnori/memlink
repo_name: velnori/memlink
docs_dir: docs

exclude_docs: |
  /manaul/
  /relaunch/
  /superpowers/plans/
  /logo-ideas.md
  /logo-concepts/
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Quick Start: guide/quickstart.md
  - Full Migration: guide/full-migration.md
  - CLI: guide/cli.md
  - Context Handoff:
      - Workflow: guide/context-handoff.md
      - Privacy: guide/context-privacy.md
      - Codex: guide/handoff-codex.md
      - Claude Code: guide/handoff-claude-code.md
  - Migration to 2.0: guide/migration-2.0.md
  - Compatibility and Loss: guide/compatibility.md
  - Architecture: guide/architecture.md
  - Privacy and Threat Model: guide/privacy.md
  - No Network / API: guide/no-network.md
  - Synthetic Demos: guide/demos.md
  - Benchmark: guide/benchmark.md
  - Local Release Readiness: guide/releasing.md
  - Feedback Template: community/feedback.md
  - Real Case Template: community/real-case.md
  - Design: DESIGN.md
  - Formats:
      - Ombre Brain: formats/ombre.md
      - OpenClaw: formats/openclaw.md
      - Mem0: formats/mem0.md
      - Zep: formats/zep.md
      - Generic Markdown: formats/generic.md
      - ChatGPT Export: formats/chatgpt.md
      - Claude Export: formats/claude_export.md
      - Stream Summary: formats/stream-summary.md
  - Plugin API: api/plugin.md

plugins:
  - search
