name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install mkdocs-material

      - name: Fetch documentation history
        run: git fetch --no-tags origin refs/heads/gh-pages:refs/heads/gh-pages

      - run: mkdocs gh-deploy
