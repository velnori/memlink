name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/release.txt
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check python/memlink/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check python/memlink/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy python/memlink/ scripts/

      - name: Schema validation
        run: >-
          python -c "from memlink.validators import validate_instance;
          assert not validate_instance({'schema_version':'1','id':'valid','valence':0.0});
          assert validate_instance({'schema_version':'future','id':'invalid'});
          assert validate_instance({'schema_version':'1','id':'invalid','valence':2.0});
          print('Packaged canonical schema and actual instances validated')"

      - name: Test
        run: pytest tests/ -v --cov=memlink --cov-report=xml --cov-report=term

      - name: Installed adapter conformance
        run: memlink conformance --report conformance.json

      - name: Upload coverage
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
